openapi: 3.0.3
info:
  title: FoodSave API
  version: 1.0.0
  description: Catálogo y reservas de alimentos disponibles para rescate.
servers:
  - url: http://localhost:3000
    description: API local de AWS SAM.
  - url: https://{apiId}.execute-api.{region}.amazonaws.com
    description: API desplegada en Amazon API Gateway.
    variables:
      apiId:
        default: foodsave
      region:
        default: us-east-1
security: []
paths:
  /health:
    get:
      summary: Comprobar el estado de la API
      operationId: getHealth
      responses:
        '200':
          description: API disponible.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    example: foodsave-api
  /products:
    get:
      summary: Consultar ofertas disponibles
      operationId: listProducts
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductCategory'
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Productos disponibles.
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
  /orders:
    post:
      summary: Crear una reserva de productos
      operationId: createOrder
      description: Reserva inventario por 15 minutos sin procesar pagos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Reserva creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Uno o más productos ya no existen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El inventario cambió o el producto venció.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Se alcanzó el límite temporal de reservas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{orderId}/status:
    get:
      summary: Consultar el estado de una reserva
      operationId: getOrderStatus
      description: Requiere el token privado de seguimiento recibido al crear la reserva.
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
        - in: header
          name: x-order-token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estado actual del pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El token de seguimiento no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No se encontró el pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /webhooks/mercadopago:
    post:
      summary: Procesar una notificación firmada de Mercado Pago
      operationId: processMercadoPagoWebhook
      description: Verifica la firma y consulta el pago directamente antes de confirmar la reserva.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
      responses:
        '200':
          description: Notificación verificada y procesada o ignorada de forma idempotente.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Reserva asociada al pago no encontrada.
        '502':
          description: No se pudo consultar el pago en Mercado Pago.
        '503':
          description: El servicio de pagos aún no está configurado.
  /profile:
    get:
      summary: Consultar el perfil autenticado
      operationId: getUserProfile
      security:
        - CognitoBearer: []
      responses:
        '200':
          description: Perfil de la cuenta autenticada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: Perfil aún no creado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Se debe aceptar la versión vigente de la política de privacidad.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /merchant/application:
    get:
      summary: Consultar solicitud de comercio
      operationId: getMerchantApplication
      security:
        - CognitoBearer: []
      responses:
        '200':
          description: Solicitud asociada a la cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantApplication'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La cuenta aún no ha solicitado vender.
    post:
      summary: Registrar una tienda para vender
      operationId: submitMerchantApplication
      security:
        - CognitoBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantApplicationRequest'
      responses:
        '201':
          description: Tienda registrada y activada automáticamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: La cuenta ya tiene una solicitud.
  /admin/merchant-applications/{sub}/decision:
    put:
      summary: Aprobar o rechazar una solicitud de comercio
      operationId: reviewMerchantApplication
      security:
        - CognitoBearer: []
      parameters:
        - name: sub
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
      responses:
        '200':
          description: Decisión registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantApplication'
        '403':
          description: Se requiere pertenecer al grupo FoodSaveAdmins.
        '409':
          description: Solicitud inexistente o ya revisada.
  /merchant/images/upload-url:
    post:
      summary: Obtener un formulario de carga privado para una imagen
      operationId: createMerchantImageUpload
      security:
        - CognitoBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType]
              properties:
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
      responses:
        '200':
          description: URL y campos para carga S3 con vencimiento de cinco minutos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: El comercio no está aprobado.
        '503':
          description: El almacenamiento aún no está configurado.
  /merchant/products:
    post:
      summary: Publicar producto de un comercio aprobado
      description: El vencimiento debe ser futuro y no superar 120 horas; para verduras, 48 horas. Las verduras se retiran tras 48 horas publicadas.
      operationId: createMerchantProduct
      security:
        - CognitoBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantProductRequest'
      responses:
        '201':
          description: Producto publicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: El comercio no está aprobado o la imagen no le pertenece.
        '503':
          description: El almacenamiento aún no está configurado.
    put:
      summary: Actualizar el perfil autenticado
      operationId: saveUserProfile
      security:
        - CognitoBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfile'
      responses:
        '200':
          description: Perfil guardado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Se debe aceptar la versión vigente de la política de privacidad.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  responses:
    BadRequest:
      description: Solicitud inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Se requiere una sesión válida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    CognitoBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProductCategory:
      type: string
      enum: [frutas, verduras, panaderia, lacteos, sorpresa]
    Product:
      type: object
      required:
        - id
        - title
        - storeName
        - category
        - originalPrice
        - discountPrice
        - expirationDate
        - stock
        - imageUrl
      properties:
        id:
          type: string
        title:
          type: string
        storeName:
          type: string
        category:
          $ref: '#/components/schemas/ProductCategory'
        originalPrice:
          type: integer
          minimum: 1
          description: Precio original en pesos colombianos.
        discountPrice:
          type: integer
          minimum: 1
          description: Precio de rescate en pesos colombianos.
        expirationDate:
          type: string
          format: date-time
        stock:
          type: integer
          minimum: 0
        imageUrl:
          type: string
          format: uri
        merchantId:
          type: string
        imageKey:
          type: string
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [buyerName, buyerPhone, privacyPolicyVersion, items]
      properties:
        buyerName:
          type: string
          minLength: 2
          maxLength: 80
        buyerPhone:
          type: string
          minLength: 7
          maxLength: 20
          pattern: '^[+\d\s()-]+$'
        buyerEmail:
          type: string
          format: email
          maxLength: 254
          description: Opcional para reservas de invitados.
        privacyPolicyVersion:
          type: string
          enum: ['2026-11-18']
          description: Versión que el comprador aceptó antes de reservar.
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [productId, quantity]
            properties:
              productId:
                type: string
                minLength: 1
              quantity:
                type: integer
                minimum: 1
                maximum: 20
        delivery:
          description: Si se omite, la reserva se toma como recogida en tienda.
          allOf:
            - $ref: '#/components/schemas/DeliveryDetails'
    DeliveryDetails:
      oneOf:
        - $ref: '#/components/schemas/PickupDelivery'
        - $ref: '#/components/schemas/HomeDelivery'
      discriminator:
        propertyName: method
    PickupDelivery:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method:
          type: string
          enum: [pickup]
    HomeDelivery:
      type: object
      additionalProperties: false
      required: [method, city, zone, neighborhood, address]
      properties:
        method:
          type: string
          enum: [delivery]
        city:
          type: string
          minLength: 2
          maxLength: 80
        zone:
          type: string
          minLength: 2
          maxLength: 80
        neighborhood:
          type: string
          minLength: 2
          maxLength: 80
        address:
          type: string
          minLength: 5
          maxLength: 160
        reference:
          type: string
          maxLength: 160
    OrderReceipt:
      type: object
      required: [orderId, status, total, createdAt, reservationExpiresAt, items, statusSubscriptionToken]
      properties:
        orderId:
          type: string
        status:
          type: string
          enum: [reserved]
        total:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        reservationExpiresAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            required: [productId, title, quantity, unitPrice, lineTotal]
            properties:
              productId:
                type: string
              title:
                type: string
              quantity:
                type: integer
              unitPrice:
                type: integer
              lineTotal:
                type: integer
        statusSubscriptionToken:
          type: string
          description: Token privado para consultar y recibir actualizaciones del pedido.
    OrderStatus:
      type: object
      required: [orderId, status, paymentExpiresAt]
      properties:
        orderId:
          type: string
        status:
          type: string
          enum: [reserved, pending_payment, paid, expired, payment_late]
        paymentExpiresAt:
          type: string
          format: date-time
    UpdateUserProfile:
      type: object
      additionalProperties: false
      required: [name, phone, privacyPolicyVersion]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          type: string
          maxLength: 20
          pattern: '^[+\d\s()-]*$'
        privacyPolicyVersion:
          type: string
          enum: ['2026-11-18']
    UserProfile:
      type: object
      required: [sub, email, name, phone, updatedAt]
      properties:
        sub:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        privacyPolicyVersion:
          type: string
          enum: ['2026-11-18']
        privacyAcceptedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MerchantApplicationRequest:
      type: object
      additionalProperties: false
      required: [storeName, ownerName, contactEmail, phone, city, address]
      properties:
        storeName:
          type: string
          minLength: 2
          maxLength: 100
        ownerName:
          type: string
          minLength: 2
          maxLength: 80
        contactEmail:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 20
          pattern: '^[+\d\s()-]+$'
        city:
          type: string
          minLength: 2
          maxLength: 80
        address:
          type: string
          minLength: 5
          maxLength: 160
        description:
          type: string
          maxLength: 500
    MerchantApplication:
      allOf:
        - $ref: '#/components/schemas/MerchantApplicationRequest'
        - type: object
          required: [sub, status, createdAt, updatedAt]
          properties:
            sub:
              type: string
            status:
              type: string
              enum: [pending_review, approved, rejected]
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            reviewedBy:
              type: string
    MerchantProductRequest:
      type: object
      additionalProperties: false
      required: [title, category, originalPrice, discountPrice, expirationDate, stock, imageKey]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 100
        category:
          $ref: '#/components/schemas/ProductCategory'
        originalPrice:
          type: integer
          minimum: 1
        discountPrice:
          type: integer
          minimum: 1
        expirationDate:
          type: string
          format: date-time
        stock:
          type: integer
          minimum: 1
          maximum: 1000
        imageKey:
          type: string
          maxLength: 512
    ImageUpload:
      type: object
      required: [key, url, fields]
      properties:
        key:
          type: string
        url:
          type: string
          format: uri
        fields:
          type: object
          additionalProperties:
            type: string
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
