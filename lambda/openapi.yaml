openapi: 3.0.3
info:
  title: FoodSave API
  version: 1.0.0
  description: Catálogo y reservas de alimentos disponibles para rescate.
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: API disponible.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    example: foodsave-api
  /products:
    get:
      operationId: listProducts
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductCategory'
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Productos disponibles.
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
  /orders:
    post:
      operationId: createOrder
      description: Reserva productos y descuenta existencias de forma atómica; no procesa pagos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Reserva creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Uno o más productos ya no existen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El inventario cambió o el producto venció.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /profile:
    get:
      operationId: getUserProfile
      security:
        - CognitoBearer: []
      responses:
        '200':
          description: Perfil de la cuenta autenticada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: Perfil aún no creado.
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: saveUserProfile
      security:
        - CognitoBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfile'
      responses:
        '200':
          description: Perfil guardado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    BadRequest:
      description: Solicitud inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Se requiere una sesión válida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    CognitoBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProductCategory:
      type: string
      enum: [frutas, panaderia, lacteos, sorpresa]
    Product:
      type: object
      required:
        - id
        - title
        - storeName
        - category
        - originalPrice
        - discountPrice
        - expirationDate
        - stock
        - imageUrl
      properties:
        id:
          type: string
        title:
          type: string
        storeName:
          type: string
        category:
          $ref: '#/components/schemas/ProductCategory'
        originalPrice:
          type: integer
          minimum: 1
          description: Precio original en pesos colombianos.
        discountPrice:
          type: integer
          minimum: 1
          description: Precio de rescate en pesos colombianos.
        expirationDate:
          type: string
          format: date-time
        stock:
          type: integer
          minimum: 0
        imageUrl:
          type: string
          format: uri
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [buyerName, buyerPhone, items]
      properties:
        buyerName:
          type: string
          minLength: 2
          maxLength: 80
        buyerPhone:
          type: string
          minLength: 7
          maxLength: 20
          pattern: '^[+\d\s()-]+$'
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [productId, quantity]
            properties:
              productId:
                type: string
                minLength: 1
              quantity:
                type: integer
                minimum: 1
                maximum: 20
        delivery:
          $ref: '#/components/schemas/DeliveryDetails'
          description: Si se omite, la reserva se toma como recogida en tienda.
    DeliveryDetails:
      oneOf:
        - type: object
          additionalProperties: false
          required: [method]
          properties:
            method:
              type: string
              enum: [pickup]
        - type: object
          additionalProperties: false
          required: [method, city, zone, neighborhood, address]
          properties:
            method:
              type: string
              enum: [delivery]
            city:
              type: string
              minLength: 2
              maxLength: 80
            zone:
              type: string
              minLength: 2
              maxLength: 80
            neighborhood:
              type: string
              minLength: 2
              maxLength: 80
            address:
              type: string
              minLength: 5
              maxLength: 160
            reference:
              type: string
              maxLength: 160
      discriminator:
        propertyName: method
    OrderReceipt:
      type: object
      required: [orderId, status, total, createdAt]
      properties:
        orderId:
          type: string
        status:
          type: string
          enum: [reserved]
        total:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    UpdateUserProfile:
      type: object
      additionalProperties: false
      required: [name, phone]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          type: string
          maxLength: 20
          pattern: '^[+\d\s()-]*$'
    UserProfile:
      allOf:
        - $ref: '#/components/schemas/UpdateUserProfile'
        - type: object
          required: [sub, email, updatedAt]
          properties:
            sub:
              type: string
            email:
              type: string
              format: email
            updatedAt:
              type: string
              format: date-time
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
