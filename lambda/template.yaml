AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FoodSave REST API with Lambda and DynamoDB

Parameters:
  FrontendOrigin:
    Type: String
    Default: http://localhost:4200
    Description: Allowed origin for the Angular application.

Resources:
  FoodSaveHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PUT
          - OPTIONS
        MaxAge: 300
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              audience:
                - !Ref FoodSaveUserPoolClient
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${FoodSaveUserPool}'

  FoodSaveApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handler.handler
      Runtime: nodejs22.x
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ''
          PRODUCTS_TABLE: !Ref FoodSaveProducts
          ORDERS_TABLE: !Ref FoodSaveOrders
          USERS_TABLE: !Ref FoodSaveUsers
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt FoodSaveProducts.Arn
                - !Sub '${FoodSaveProducts.Arn}/index/*'
                - !GetAtt FoodSaveOrders.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                - !GetAtt FoodSaveUsers.Arn
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref FoodSaveHttpApi
            Path: /health
            Method: GET
        ListProducts:
          Type: HttpApi
          Properties:
            ApiId: !Ref FoodSaveHttpApi
            Path: /products
            Method: GET
        CreateOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref FoodSaveHttpApi
            Path: /orders
            Method: POST
        GetProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref FoodSaveHttpApi
            Path: /profile
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        SaveProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref FoodSaveHttpApi
            Path: /profile
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  FoodSaveUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: FoodSaveUsers
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: phone_number
          AttributeDataType: String
          Mutable: true
          Required: false

  FoodSaveUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: FoodSaveWeb
      UserPoolId: !Ref FoodSaveUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  FoodSaveUsers:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: FoodSaveUsers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sub
          AttributeType: S
      KeySchema:
        - AttributeName: sub
          KeyType: HASH

  FoodSaveProducts:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: FoodSaveProducts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: category
          AttributeType: S
        - AttributeName: title
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CategoryTitleIndex
          KeySchema:
            - AttributeName: category
              KeyType: HASH
            - AttributeName: title
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  FoodSaveOrders:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: FoodSaveOrders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

Outputs:
  FoodSaveApiUrl:
    Description: Base URL for the FoodSave API.
    Value: !Sub 'https://${FoodSaveHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  FoodSaveUserPoolId:
    Description: Cognito User Pool ID for FoodSave accounts.
    Value: !Ref FoodSaveUserPool
  FoodSaveUserPoolClientId:
    Description: Public Cognito app client ID for the Angular frontend.
    Value: !Ref FoodSaveUserPoolClient
